<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEXVO — More</title>


    <!-- =====================================
         GLOBAL CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="../css/global.css"
    >


    <!-- =====================================
         UNIVERSAL N BUTTON
    ====================================== -->

    <link
        rel="stylesheet"
        href="../css/nexvo-plus.css"
    >


    <!-- =====================================
         MORE CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="../css/more.css"
    >

</head>


<body>


    <!-- =====================================
         MORE PAGE
    ====================================== -->

    <main class="more-page">


        <!-- HEADER -->

        <header class="more-header">

            <div>

                <span class="page-label">
                    NEXVO
                </span>

                <h1>
                    More
                </h1>

            </div>

        </header>



        <!-- =================================
             MORE MENU
        ================================== -->

        <section class="more-menu">


            <!-- PROFILE -->

            <button
                class="more-item"
                data-feature="profile"
                type="button"
            >

                <span class="more-icon">
                    👤
                </span>

                <span class="more-text">

                    <strong>
                        My Profile
                    </strong>

                    <small>
                        Manage your NEXVO profile
                    </small>

                </span>

                <span>
                    ›
                </span>

            </button>



            <!-- SETTINGS -->

            <button
                class="more-item"
                data-feature="settings"
                type="button"
            >

                <span class="more-icon">
                    ⚙️
                </span>

                <span class="more-text">

                    <strong>
                        Settings
                    </strong>

                    <small>
                        Control your NEXVO experience
                    </small>

                </span>

                <span>
                    ›
                </span>

            </button>



            <!-- NOTIFICATIONS -->

            <button
                class="more-item"
                data-feature="notifications"
                type="button"
            >

                <span class="more-icon">
                    🔔
                </span>

                <span class="more-text">

                    <strong>
                        Notifications
                    </strong>

                    <small>
                        Manage notifications
                    </small>

                </span>

                <span>
                    ›
                </span>

            </button>



            <!-- PRIVACY -->

            <button
                class="more-item"
                data-feature="privacy"
                type="button"
            >

                <span class="more-icon">
                    🔐
                </span>

                <span class="more-text">

                    <strong>
                        Privacy & Security
                    </strong>

                    <small>
                        Protect your NEXVO account
                    </small>

                </span>

                <span>
                    ›
                </span>

            </button>



            <!-- FRIENDS -->

            <button
                class="more-item"
                type="button"
                data-feature="friends"
            >

                <span class="more-icon">
                    👥
                </span>

                <span class="more-text">

                    <strong>
                        Friends
                    </strong>

                    <small>
                        View your friends
                    </small>

                </span>

                <span>
                    ›
                </span>

            </button>



            <!-- FRIEND REQUESTS -->

            <button
                class="more-item"
                type="button"
                data-feature="friend-requests"
            >

                <span class="more-icon">
                    💌
                </span>

                <span class="more-text">

                    <strong>
                        Friend Requests
                    </strong>

                    <small>
                        Manage incoming and sent requests
                    </small>

                </span>

                <span>
                    ›
                </span>

            </button>


        </section>


    </main>



    <!-- =====================================
         SCRIPTS
    ====================================== -->

    <script
        src="../data/nexvo-data.js"
    ></script>


    <!-- UNIVERSAL N BUTTON -->

    <script
        src="../js/nexvo-plus.js"
    ></script>


    <!-- MORE PAGE LOGIC -->

    <script
        src="../js/more.js"
    ></script>


</body>

</html>
