<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEXVO — Friends</title>


    <!-- =================================
         GLOBAL
    ================================= -->

    <link
        rel="stylesheet"
        href="../css/global.css"
    >


    <!-- =================================
         NEXVO UNIVERSAL N BUTTON
    ================================= -->

    <link
        rel="stylesheet"
        href="../css/nexvo-plus.css"
    >


    <!-- =================================
         FRIENDS
    ================================= -->

    <link
        rel="stylesheet"
        href="../css/friends.css"
    >

</head>


<body>


    <!-- =================================
         FRIENDS PAGE
    ================================= -->

    <main class="friends-page">


        <!-- HEADER -->

        <header class="friends-header">

            <div>

                <span class="page-label">
                    NEXVO
                </span>

                <h1>
                    Friends
                </h1>

            </div>

        </header>


        <!-- SEARCH -->

        <div class="friends-search">

            <span>
                🔍
            </span>

            <input
                type="search"
                id="friendsSearchInput"
                placeholder="Search friends"
                autocomplete="off"
            >

        </div>


        <!-- FRIENDS LIST -->

        <section
            class="friends-list"
            id="friendsList"
        ></section>


        <!-- EMPTY STATE -->

        <section
            class="friends-empty"
            id="friendsEmpty"
        >

            <div class="friends-empty-icon">
                👥
            </div>

            <h2>
                No friends yet
            </h2>

            <p>
                Add people to your NEXVO friends
                list and start conversations.
            </p>

        </section>


    </main>


    <!-- =================================
         DATA
    ================================= -->

    <script src="../data/nexvo-data.js"></script>


    <!-- =================================
         UNIVERSAL N BUTTON
    ================================= -->

    <script src="../js/nexvo-plus.js"></script>


    <!-- =================================
         FRIENDS PAGE JAVASCRIPT
    ================================= -->

    <script src="../js/friends.js"></script>


</body>

</html>
