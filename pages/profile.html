<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEXVO • Profile</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/profile.css"
    >

</head>


<body>

<main class="profile-page">


    <!-- HEADER -->

    <header class="profile-header">

        <button
            id="backButton"
            class="profile-back"
            type="button"
        >
            ‹
        </button>


        <h1>
            Profile
        </h1>


        <button
            id="editProfileButton"
            class="edit-profile"
            type="button"
        >
            Edit
        </button>

    </header>



    <!-- PROFILE -->

    <section class="profile-card">


        <div
            id="profileAvatar"
            class="profile-avatar"
        >
            👤
        </div>


        <h2 id="profileName">
            NEXVO Member
        </h2>


        <p id="profileUsername">
            @username
        </p>


        <p
            id="profileBio"
            class="profile-bio"
        ></p>


    </section>



    <!-- NEXVO ID -->

    <section class="identity-card">

        <div>

            <span class="identity-label">
                NEXVO ID
            </span>

            <strong id="nexvoId">
                —
            </strong>

        </div>


        <button
            id="copyIdButton"
            type="button"
        >
            Copy
        </button>

    </section>



    <!-- CONNECTION -->

    <section class="profile-section">

        <h3>
            Your identity
        </h3>


        <div class="info-card">

            <p>
                Your NEXVO ID stays connected to
                your account even if you change
                your display name.
            </p>

        </div>

    </section>



</main>


<script src="../data/identity.js"></script>

<script src="../js/profile.js"></script>

</body>

</html>
