<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NEXVO — Call</title>


<link
    rel="stylesheet"
    href="../css/global.css"
>

<link
    rel="stylesheet"
    href="../css/call-screen.css"
>

</head><body><main class="call-screen">


    <!-- TOP -->

    <header class="call-screen-header">

        <button
            id="callBackButton"
            class="call-back-button"
            type="button"
            aria-label="Back"
        >
            ‹
        </button>


        <span>
            NEXVO CALL
        </span>


        <div class="call-security">
            🔒
        </div>

    </header>



    <!-- CONTACT -->

    <section class="calling-contact">


        <div
            id="callingAvatar"
            class="calling-avatar"
        >
            👤
        </div>


        <h1 id="callingName">
            NEXVO Member
        </h1>


        <p id="callingNumber">
            Calling...
        </p>


        <div
            id="callingStatus"
            class="calling-status"
        >
            Calling
        </div>


    </section>



    <!-- CALL INFORMATION -->

    <section class="call-info-card">


        <div class="call-info-row">

            <span>
                Type
            </span>

            <strong id="callType">
                Audio
            </strong>

        </div>


        <div class="call-info-row">

            <span>
                Duration
            </span>

            <strong id="callDuration">
                00:00
            </strong>

        </div>


    </section>



    <!-- CONTROLS -->

    <section class="call-controls">


        <button
            id="muteButton"
            class="call-control"
            type="button"
        >

            <span class="control-icon">
                🔇
            </span>

            <span>
                Mute
            </span>

        </button>



        <button
            id="speakerButton"
            class="call-control"
            type="button"
        >

            <span class="control-icon">
                🔊
            </span>

            <span>
                Speaker
            </span>

        </button>



        <button
            id="recordButton"
            class="call-control"
            type="button"
        >

            <span class="control-icon">
                ⏺
            </span>

            <span>
                Record
            </span>

        </button>



        <button
            id="videoButton"
            class="call-control"
            type="button"
        >

            <span class="control-icon">
                🎥
            </span>

            <span>
                Video
            </span>

        </button>


    </section>



    <!-- END CALL -->

    <section class="call-end-area">

        <button
            id="endCallButton"
            class="end-call-button"
            type="button"
            aria-label="End call"
        >
            📞
        </button>

        <span>
            End call
        </span>

    </section>


</main>



<script src="../data/nexvo-data.js"></script>

<script src="../js/call-screen.js"></script>

</body></html>
