<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="NEXVO — Connect. Express. Belong."
    >

    <title>NEXVO</title>

    <!-- ================================
         GLOBAL CSS
    ================================= -->

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <!-- ================================
         SPLASH CSS
    ================================= -->

    <link
        rel="stylesheet"
        href="/css/splash.css"
    >

</head>


<body>

    <!-- =================================
         NEXVO APPLICATION
    ================================= -->

    <main id="app">

        <!-- =================================
             SPLASH SCREEN
        ================================= -->

        <section
            id="splashScreen"
            class="splash-screen"
            aria-label="NEXVO loading screen"
        >

            <!-- Background glow -->

            <div
                class="splash-glow splash-glow-one"
            ></div>

            <div
                class="splash-glow splash-glow-two"
            ></div>


            <!-- Animated orbit -->

            <div class="logo-orbit">

                <span class="orbit-dot orbit-dot-one"></span>

                <span class="orbit-dot orbit-dot-two"></span>

                <span class="orbit-dot orbit-dot-three"></span>

            </div>


            <!-- NEXVO Logo -->

            <div
                id="nexvoLogo"
                class="nexvo-logo"
            >

                <div class="logo-symbol">

                    <span class="logo-letter">
                        N
                    </span>

                </div>


                <div
                    id="nexvoName"
                    class="nexvo-name"
                >
                    NEXVO
                </div>

            </div>


            <!-- Tagline -->

            <p
                id="nexvoTagline"
                class="nexvo-tagline"
            >
                Connect. Express. Belong.
            </p>


            <!-- Loading indicator -->

            <div
                id="splashLoader"
                class="splash-loader"
            >

                <span></span>
                <span></span>
                <span></span>

            </div>

        </section>


        <!-- =================================
             FUTURE APPLICATION CONTENT
        ================================= -->

        <section
            id="appContent"
            class="app-content"
            aria-hidden="true"
        >

            <!--

                Future screens will appear here.

                Onboarding
                Login
                Sign Up
                Home
                Chats
                Profile
                etc.

            -->

        </section>

    </main>


    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script src="/js/config.js"></script>

    <script src="/js/splash.js"></script>

</body>

</html>
