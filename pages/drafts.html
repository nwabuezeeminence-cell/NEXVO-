<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEXVO — Drafts</title>


    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/drafts.css"
    >

</head>


<body>


<main class="drafts-page">


    <!-- HEADER -->

    <header class="drafts-header">

        <button
            id="draftsBackButton"
            class="drafts-back"
            type="button"
            aria-label="Go back"
        >
            ‹
        </button>


        <div class="drafts-heading">

            <span>
                ME
            </span>

            <h1>
                Drafts
            </h1>

        </div>


        <button
            id="draftsUploadButton"
            class="drafts-upload"
            type="button"
            aria-label="Upload video"
        >
            +
        </button>

    </header>



    <!-- DRAFT LIST -->

    <section
        id="draftsList"
        class="drafts-list"
    ></section>



    <!-- EMPTY STATE -->

    <section
        id="draftsEmpty"
        class="drafts-empty"
    >

        <div class="drafts-empty-icon">
            N
        </div>


        <h2>
            No drafts yet
        </h2>


        <p>
            Videos you save as drafts
            will appear here.
        </p>


        <button
            id="emptyDraftUploadButton"
            type="button"
        >
            Create a draft
        </button>

    </section>


</main>


<script src="../js/drafts.js"></script>

</body>

</html>
