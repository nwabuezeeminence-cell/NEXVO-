<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEXVO — My Videos</title>


    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/my-videos.css"
    >

</head>


<body>


<main class="my-videos-page">


    <!-- HEADER -->

    <header class="my-videos-header">

        <button
            id="myVideosBackButton"
            class="my-videos-back"
            type="button"
            aria-label="Go back"
        >
            ‹
        </button>


        <div class="my-videos-heading">

            <span>
                ME
            </span>

            <h1>
                My Videos
            </h1>

        </div>


        <button
            id="myVideosUploadButton"
            class="my-videos-upload"
            type="button"
            aria-label="Upload video"
        >
            +
        </button>

    </header>



    <!-- CONTENT -->

    <section
        id="myVideosList"
        class="my-videos-list"
    ></section>



    <!-- EMPTY -->

    <section
        id="myVideosEmpty"
        class="my-videos-empty"
    >

        <div class="my-videos-empty-icon">
            N
        </div>


        <h2>
            No videos yet
        </h2>


        <p>
            Videos you upload on this device
            will appear here.
        </p>


        <button
            id="emptyUploadButton"
            type="button"
        >
            Upload your first video
        </button>

    </section>


</main>


<script src="../js/my-videos.js"></script>

</body>

</html>
