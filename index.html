<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="NEXVO — Connect. Express. Belong."
    >

    <title>NEXVO</title>


    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/splash.css"
    >

</head>


<body>

    <main id="app">

        <section
            id="splashScreen"
            class="splash-screen"
            aria-label="NEXVO loading screen"
        >

            <div
                class="splash-glow splash-glow-one"
            ></div>

            <div
                class="splash-glow splash-glow-two"
            ></div>


            <div class="logo-orbit">

                <span
                    class="orbit-dot orbit-dot-one"
                ></span>

                <span
                    class="orbit-dot orbit-dot-two"
                ></span>

                <span
                    class="orbit-dot orbit-dot-three"
                ></span>

            </div>


            <div
                id="nexvoLogo"
                class="nexvo-logo"
            >

                <div class="logo-symbol">

                    <span class="logo-letter">
                        N
                    </span>

                </div>


                <div
                    id="nexvoName"
                    class="nexvo-name"
                >
                    NEXVO
                </div>

            </div>


            <p
                id="nexvoTagline"
                class="nexvo-tagline"
            >
                Connect. Express. Belong.
            </p>


            <div
                id="splashLoader"
                class="splash-loader"
            >

                <span></span>
                <span></span>
                <span></span>

            </div>

        </section>

    </main>


    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>


    <!-- NEXVO Firebase configuration -->

    <script src="js/firebase-config.js"></script>

    <script src="js/firebase-init.js"></script>


    <!-- NEXVO startup -->

    <script src="js/startup.js"></script>

</body>

</html>
